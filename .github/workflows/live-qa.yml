name: Live QA – test.web-tie.ru
on:
  workflow_dispatch:
  # Test-only QA changes should verify themselves on the deployed site.
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-qa.yml'
      - 'frontend/live-qa/**'
      - 'frontend/playwright.live.config.ts'
  workflow_run:
    workflows: ['Deploy Architecture Hub frontend (test)']
    types: [completed]
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: read
  issues: write
jobs:
  live-browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same prebuilt Chromium + OS libraries as the main browser CI.
    # Avoid apt-get failures when Ubuntu mirrors/DNS are unavailable.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Diagnose static JS/CSS delivery before launching Chromium
        # Diagnostics must not suppress browser traces when delivery fails.
        continue-on-error: true
        shell: bash
        env:
          TARGET_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || 'https://test.web-tie.ru' }}
        run: |
          set -euo pipefail
          html="$(mktemp)"
          curl --fail --silent --show-error --compressed --connect-timeout 10 --max-time 25 --retry 2 \
            "${TARGET_URL%/}/" -o "$html"
          mapfile -t assets < <(grep -oE '/assets/[^"]+\.(js|css)' "$html" | sort -u)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "::error::Expected frontend JS and CSS assets in the published HTML"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            output="$(mktemp)"
            echo "Checking static asset ${asset}"
            curl --fail --silent --show-error --compressed \
              --connect-timeout 10 --max-time 35 --retry 1 \
              -w 'HTTP %{http_code}; received %{size_download} bytes in %{time_total}s\n' \
              "${TARGET_URL%/}${asset}" -o "$output"
            count="$(wc -c < "$output")"
            if [ "$count" -lt 1024 ]; then
              echo "::error::Asset ${asset} is unexpectedly short: ${count} bytes"
              exit 1
            fi
          done
          echo "Static asset preflight complete"
      - name: Test deployed website
        id: live_test
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || 'https://test.web-tie.ru' }}
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
        run: npx playwright test --config=playwright.live.config.ts
      - name: Setup Python for failure diagnostics
        if: failure() && steps.live_test.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AI triage of failed Live QA Playwright tests
        if: failure() && steps.live_test.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAYWRIGHT_AI_SEND_SCREENSHOTS: '0'
        run: python scripts/playwright_ai_triage.py frontend/live-qa-results/playwright-results.json playwright-live-ai-triage.md
      - name: Record QA result and create or update a single tracking issue
        if: always() && steps.live_test.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          QA_OUTCOME: ${{ steps.live_test.outcome }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '[Live QA] Test server browser regression'
            const { owner, repo } = context.repo
            const state = process.env.QA_OUTCOME
            const runUrl = process.env.QA_RUN_URL
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (state === 'failure') {
              const body = [
                'Automated Playwright verification failed on the deployed test server.',
                '',
                '- Workflow run: ' + runUrl,
                '- Trigger: ' + context.eventName,
                '- Ref: ' + context.sha,
                '- Desktop/mobile screenshots, traces, HTML report and sanitized AI triage (when available): download artifact `live-qa-browser-report` from the workflow run.',
                '',
                'Review the failing test logs and attached screenshots before making changes.',
                'This issue is reused for subsequent failures to prevent duplicates.',
              ].join('\\n')
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body })
              } else {
                await github.rest.issues.create({ owner, repo, title, body })
              }
            } else if (state === 'success' && existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: 'Live QA passed: ' + runUrl + '. Closing the tracking issue.' })
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' })
            }
      - name: Save screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-browser-report
          path: |
            frontend/live-qa-results/
            frontend/live-qa-report/
            playwright-live-ai-triage.md
          retention-days: 14
          if-no-files-found: warn
