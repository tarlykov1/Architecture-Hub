<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArchHub · Системы</title><style>
*{box-sizing:border-box}body{margin:0;color:#192e39;background:#f5f7f8;font:15px/1.45 Inter,system-ui,sans-serif}header,main{padding:0 max(16px,calc((100vw - 1200px)/2))}header{height:58px;display:flex;align-items:center;gap:22px;background:#173b42;color:white}header b{font-size:21px}header small{margin-left:auto;color:#d0e4de}main{padding-top:22px;padding-bottom:40px}nav,.bar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{padding-bottom:12px;border-bottom:1px solid #ccd9da}button,select,input{font:inherit;border:1px solid #bacacb;background:white;color:#163f46;border-radius:6px;padding:7px 11px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#148475}button[aria-current=true],.primary{background:#17675e;color:white;border-color:#17675e}h1{font-size:25px;margin:0}.bar{margin:18px 0;justify-content:space-between}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8e9}th{font-size:12px;color:#526970;background:#edf2f2}.scroll{overflow:auto}.link{border:0;padding:3px;color:#086e62;text-align:left;text-decoration:underline;text-underline-offset:3px}.canvas{position:relative;isolation:isolate;border:1px solid #c9d7d8;border-radius:9px;overflow:hidden;background:#fff}.lane{display:grid;grid-template-columns:130px 1fr;align-items:center;padding:18px 15px;gap:10px;border-bottom:2px solid white;background:var(--tint)}.lane h2{font-size:12px;color:#3a575b}.nodes{display:flex;justify-content:space-evenly;gap:12px;flex-wrap:wrap}.node{z-index:2;position:relative;width:174px;text-align:left;border-left:4px solid var(--accent);box-shadow:0 1px 3px #172c3218}.node small{display:block;color:#506268;font-size:12px}.canvas svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.canvas path{fill:none;stroke:#637f83;stroke-width:1.6}.panel{position:fixed;inset:0 0 0 auto;width:min(405px,100vw);background:#fff;border-left:1px solid #b3c9c9;box-shadow:-10px 0 40px #1232;padding:22px;z-index:4;overflow:auto}.panel h2{margin-top:28px}.panel li{margin:8px 0}.panel label{display:grid;gap:5px;margin:12px 0}.shade{position:fixed;inset:0;background:#102b301a;z-index:3}.msg{color:#126254;margin:8px 0}p{max-width:65ch}.panel hr{border:0;border-top:1px solid #d7e2e1;margin:18px 0}button:focus-visible,select:focus-visible{outline:3px solid #faad45}
@media(max-width:650px){main{padding:12px 10px}nav{gap:5px}nav button{padding:6px 8px;font-size:13px}.lane{grid-template-columns:1fr;gap:4px;padding:9px 6px 16px}.lane h2{margin:0}.node{width:min(46%,174px);font-size:13px;padding:6px}.nodes{gap:5px}.bar{margin:12px 0}h1{font-size:21px}.panel{width:100%}header{height:46px;gap:10px}}
</style><header><b>ArchHub</b> Системы <small>Макет · демоданные</small></header><main><nav aria-label="Системы"></nav><section id="screen"></section><div id="msg" class="msg" role="status"></div></main><div id="overlay"></div>
<script>
const tabs=['Реестр ИС','Ресурсная карта','Компоненты','Оборудование','Технологии'],systems=['Bitrix24','Телефонный справочник'],resources=[
{id:'b',name:'Bitrix24',kind:'ИС',sub:'Корпоративный портал',sys:0},{id:'t',name:'Телефонный справочник',kind:'ИС',sub:'Поиск контактов',sys:1},
{id:'app',name:'Портал',kind:'Приложение',sub:'Веб-приложение',sys:0},{id:'db',name:'PostgreSQL',kind:'База данных',sub:'Хранилище портала',sys:0},{id:'queue',name:'RabbitMQ',kind:'Очередь',sub:'Фоновые задания',sys:0},{id:'svc',name:'API контактов',kind:'Сервис',sub:'Поиск сотрудников',sys:1},
{id:'vm1',name:'B24-VM-01',kind:'ВМ',sub:'Основной узел',sys:0},{id:'vm2',name:'B24-VM-02',kind:'ВМ',sub:'Второй узел',sys:0},{id:'vm3',name:'DIR-VM-01',kind:'ВМ',sub:'Сервер API',sys:1},
{id:'host',name:'SPB-HV-01',kind:'Сервер',sub:'Санкт-Петербург · стойка A1'},{id:'san',name:'SPB-SAN-01',kind:'СХД',sub:'Санкт-Петербург · стойка A2'},{id:'sw',name:'SPB-SW-01',kind:'Коммутатор',sub:'Санкт-Петербург · стойка A1'}]
const equip=resources.slice(-3),work=resources.slice(2,6),vms=resources.slice(6,9),get=id=>resources.find(o=>o.id===id),hosts={app:'vm1',db:'vm1',queue:'vm1',svc:'vm3'}
let tab=0,sys=0,editing=false,draft={},opener=null
const btn=(text,action,cl='')=>'<button class="'+cl+'" onclick="'+action+'">'+text+'</button>',call=(f,v)=>f+"('"+v+"')",inspect=o=>btn(o.name,call('card',o.id),'link')
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function go(i,s=sys){tab=i;sys=s;editing=false;closeCard();render()}
function render(){document.querySelector('nav').innerHTML=tabs.map((x,i)=>'<button aria-current="'+(i===tab)+'" onclick="go('+i+')">'+x+'</button>').join('');msg.textContent=''
let html='',controls='',items=resources.filter(o=>o.sys===sys),apps=work.filter(o=>o.sys===sys),machines=vms.filter(o=>o.sys===sys)
if(tab===0)html=table(['Система','Назначение','Статус',''],systems.map((s,i)=>[inspect(resources[i]),resources[i].sub,'В эксплуатации',btn('Ресурсная карта','go(1,'+i+')')]))
if(tab===1||tab===2)controls='<select aria-label="Информационная система" onchange="go(tab,Number(this.value))">'+systems.map((s,i)=>'<option value="'+i+'" '+(i===sys?'selected':'')+'>'+s+'</option>').join('')+'</select>'
if(tab===1){controls+=btn('Редактировать состав','editVM()','primary');const lanes=[['Информационная система',[resources[sys]],'#edf4ed','#4b8870'],['Приложения и сервисы',apps,'#faf4e7','#b58f4e'],['Виртуальные машины',machines,'#eef1f9','#7589bc'],['Серверы',[equip[0]],'#eaf4f4','#41939a'],['Хранение данных',[equip[1]],'#f4f2ea','#a19969'],['Сетевое оборудование',[equip[2]],'#edf3f5','#608a9d']]
html='<div class="canvas" id="canvas"><svg aria-hidden="true" id="lines"></svg>'+lanes.map(([name,list,tint,accent])=>'<section class="lane" style="--tint:'+tint+';--accent:'+accent+'"><h2>'+name+'</h2><div class="nodes">'+list.map(o=>'<button class="node" id="n-'+o.id+'" onclick="'+call('card',o.id)+'"><b>'+o.name+'</b><small>'+(o.kind==='ВМ'?work.filter(w=>hosts[w.id]===o.id).map(w=>w.name).join(' · ')||'Без компонентов':o.sub)+'</small></button>').join('')+'</div></section>').join('')+'</div>'}
if(tab===2)html=table(['Компонент','Тип','Размещение'],apps.map(o=>[inspect(o),o.kind,inspect(get(hosts[o.id]))]))
if(tab===3)html=table(['Устройство','Тип','Место установки','Инв. номер'],equip.map((o,i)=>[inspect(o),o.kind,o.sub,'DEMO-00'+(i+1)]))
if(tab===4)html=table(['Технология','Назначение','Система'],[[inspect(get('db')),'База данных','Bitrix24'],[inspect(get('queue')),'Очередь сообщений','Bitrix24']])
screenEl.innerHTML='<div class="bar"><h1>'+tabs[tab]+'</h1><div class="actions">'+controls+'</div></div>'+html;requestAnimationFrame(draw)}
function draw(){const c=document.querySelector('.canvas');if(!c)return;let r=c.getBoundingClientRect(),paths=[];function edge(a,b,side=false){let A=document.getElementById('n-'+a).getBoundingClientRect(),B=document.getElementById('n-'+b).getBoundingClientRect(),x=A.left+A.width/2-r.left,y=A.bottom-r.top,u=B.left+B.width/2-r.left,v=B.top-r.top,m=(y+v)/2;let d=side?'M '+(A.right-r.left)+' '+(y-A.height/2)+' H '+(r.width-5)+' V '+(v+B.height/2)+' H '+(B.right-r.left):'M '+x+' '+y+' V '+m+' H '+u+' V '+v;paths.push('<path d="'+d+'"/>')}
work.filter(o=>o.sys===sys).forEach(o=>{edge(resources[sys].id,o.id);edge(o.id,hosts[o.id])});vms.filter(o=>o.sys===sys).forEach(o=>edge(o.id,'host'));edge('host','san');edge('host','sw',true);document.getElementById('lines').innerHTML=paths.join('')}
function panel(title,body){if(!overlay.innerHTML)opener=document.activeElement;document.querySelector('main').inert=true;overlay.innerHTML='<div class="shade"></div><aside class="panel" role="dialog" aria-modal="true" aria-label="'+title+'">'+btn('← Назад','closeCard()')+'<h2>'+title+'</h2>'+body+'</aside>';overlay.querySelector('button').focus()}
function closeCard(){overlay.innerHTML='';document.querySelector('main').inert=false;editing=false;if(opener?.isConnected)opener.focus();opener=null}
function card(id){const o=get(id);let body='<p>'+o.kind+' · '+o.sub+'</p>';if(o.kind==='ВМ'){body+='<h3>Состав ВМ</h3><ul>'+work.filter(w=>hosts[w.id]===id).map(w=>'<li>'+w.name+' · '+w.kind+'</li>').join('')+'</ul>'+btn('Редактировать состав',call('editVM',id),'primary')}
else if(o.kind==='ИС')body+=btn('Ресурсная карта','go(1,'+o.sys+')');else if(hosts[id])body+='<p>Размещено на '+get(hosts[id]).name+'</p>'+btn('Ресурсная карта','go(1,'+o.sys+')');else body+='<h3>Связанные системы</h3>'+systems.map((s,i)=>btn(s,'go(1,'+i+')')).join(' ');panel(o.name,body)}
function editVM(id){editing=true;draft={...hosts};const apps=work.filter(o=>o.sys===sys),machines=vms.filter(o=>o.sys===sys);panel('Размещение компонентов','<p>'+systems[sys]+(id?' · '+get(id).name:'')+'</p>'+apps.map(w=>'<label>'+w.name+' · '+w.kind+'<select onchange="draft[\''+w.id+'\']=this.value">'+machines.map(v=>'<option value="'+v.id+'" '+(hosts[w.id]===v.id?'selected':'')+'>'+v.name+'</option>').join('')+'</select></label>').join('')+'<hr><div class="actions">'+btn('Сохранить','save()','primary')+btn('Отмена','closeCard()')+'</div>')}
function save(){Object.assign(hosts,draft);closeCard();render();msg.textContent='Размещение сохранено в макете.'}
const screenEl=document.getElementById('screen'),msg=document.getElementById('msg'),overlay=document.getElementById('overlay');window.addEventListener('resize',draw);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});render()
</script></html>
