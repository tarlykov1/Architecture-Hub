name: Architecture Hub CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx
      - name: Run isolated API tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///${{ runner.temp }}/architecture_ci.db
          ARCH_HUB_ACCESS_KEYS: '{"ci-admin-token-123456789012345678901234":"admin","ci-viewer-token-123456789012345678901234":"viewer"}'
        run: python -m pytest -q backend/tests
  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate Wiki.js Compose
        env:
          WIKI_DB_PASSWORD: ci-placeholder-do-not-use
        run: docker compose -f compose.wikijs.yml config --quiet
