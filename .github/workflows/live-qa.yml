name: Live QA – test.web-tie.ru
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Architecture Hub frontend (test)']
    types: [completed]
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: read
jobs:
  live-browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test deployed website
        working-directory: frontend
        run: npx playwright test --config=playwright.live.config.ts
      - name: Save screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-browser-report
          path: |
            frontend/live-qa-results/
            frontend/live-qa-report/
          retention-days: 14
          if-no-files-found: warn
