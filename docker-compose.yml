services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: architecture_hub
      POSTGRES_USER: architecture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architecture_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architecture -d architecture_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://architecture:${POSTGRES_PASSWORD:-architecture_dev}@db:5432/architecture_hub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  pgdata:
