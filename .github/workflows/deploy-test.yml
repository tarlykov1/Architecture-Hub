name: Deploy Architecture Hub frontend (test)

# CI (main push) -> guarded backend deploy -> frontend deploy. Never ship
# UI requiring a migration before the corresponding backend has succeeded.
# Both DEPLOY_ENABLED=true and BACKEND_DEPLOY_ENABLED=true are required.
# The backend workflow itself runs only after successful Architecture Hub CI.
on:
  workflow_run:
    workflows: ["Deploy Architecture Hub backend (test)"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: architecture-hub-test-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish verified frontend to test.web-tie.ru
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      vars.BACKEND_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DIR: /var/www/webtie.ru/data/www/test.web-tie.ru

    steps:
      - name: Download release revision from the successful backend workflow
        uses: actions/download-artifact@v4
        with:
          name: backend-release-revision
          path: ${{ runner.temp }}/backend-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the backend revision matches the current main
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat "${{ runner.temp }}/backend-release/backend-release-sha.txt")"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid backend revision artifact"
            exit 1
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$expected" ]; then
            echo "::error::Main moved after backend deployment; refusing to publish stale frontend"
            exit 1
          fi
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact commit deployed by the successful backend workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_WIKI_URL: ${{ vars.VITE_WIKI_URL }}
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install SSH identity and pinned host key
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment secret: $name"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Verify remote deployment directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_DIR' && test -w '$DEPLOY_DIR'"

      - name: Publish frontend (never touch API, SQLite, or .well-known)
        shell: bash
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          rsync -az --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='.well-known/' --exclude='.git/' \
            frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Verify public HTTPS (valid certificate required)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 --head https://test.web-tie.ru/

      - name: Verify deployed frontend revision matches the tested commit
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            -H 'Cache-Control: no-cache' \
            "https://test.web-tie.ru/build-info.json?verify=${EXPECTED_REVISION}" | jq -r '.revision')"
          echo "Expected: ${EXPECTED_REVISION}"
          echo "Published: ${actual}"
          test "${actual}" = "${EXPECTED_REVISION}"
